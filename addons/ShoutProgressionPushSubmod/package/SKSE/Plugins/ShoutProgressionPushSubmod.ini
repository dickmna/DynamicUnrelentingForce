[General]
; Master switch for this plugin.
bEnable = true

; If true, reads ShoutProgression's fDistanceMultiplier, fMinDistanceMultiplier,
; iMaxDragonSouls, and bCountSpentSouls before applying this file's overrides.
bImportShoutProgressionSettings = true

; Leave false unless diagnosing behavior in the SKSE log.
bEnableDebugLogging = false

; Override ShoutProgression's bCountSpentSouls for push scaling.
; false = current unspent dragon souls only, matching ShoutProgression's default INI.
; true = current unspent souls + known shout words.
; This key is ignored while ShoutProgression import succeeds unless bOverrideImportedSoulCounting is true.
bOverrideImportedSoulCounting = true
bCountSpentSouls = true

[Scaling]
; These mirror ShoutProgression's distance formula:
; multiplier = fMinDistanceMultiplier + min(souls, iMaxDragonSouls) * fDistanceMultiplier
; For push force, the default is deliberately overridden so 50 souls reaches
; fMaxPushForce=100, matching the 700 Percent-style anchor.
bOverrideImportedScaling = true
fMinDistanceMultiplier = 1.0
fDistanceMultiplier = 0.04
iMaxDragonSouls = 50

[UnrelentingForce]
; Uses a small VoicePushEffectScript replacement that asks this SKSE plugin for
; a scaled force before making vanilla's single PushActorAway call.
bScalePush = true

; Runtime curve anchor points. Defaults map dragon-soul progress from vanilla
; PushForce 15 to the 700 Percent-style PushForce 100.
fMinPushForce = 15.0
fMaxPushForce = 100.0

; Keep true so only player-cast VoicePushEffectScript calls are scaled.
bRequirePlayerCaster = true
